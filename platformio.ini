[platformio]
default_envs = esp32dev

[esp32_common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.3
    claws/BH1750 @ ^1.3.0
    adafruit/Adafruit INA219 @ ^1.2.3

; Firmware cho bo mach that: doc BH1750 va ba INA219 tren I2C.
[env:esp32dev]
extends = esp32_common

; Adapter rieng cho Wokwi. Wokwi chua mo phong truc tiep BH1750/INA219,
; nen LDR va ba bien tro chi duoc doc khi co co IOT_SIMULATION.
[env:wokwi]
extends = esp32_common
build_flags =
    -DIOT_SIMULATION=1
    -DIOT_WIFI_SSID=\"Wokwi-GUEST\"
    -DIOT_WIFI_PASSWORD=\"\"
    -DIOT_MQTT_HOST=\"host.wokwi.internal\"
    -DIOT_MQTT_PORT=1883
    -DIOT_HMAC_LAMP_01=\"demo-change-lamp-01\"
    -DIOT_HMAC_LAMP_02=\"demo-change-lamp-02\"
    -DIOT_HMAC_LAMP_03=\"demo-change-lamp-03\"

[env:native]
platform = native
test_framework = unity
test_build_src = no
